<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Thread City - Social media app">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Thread City">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Thread City</title>
  <link rel="manifest" href="manifest.json">

  <!-- Firebase SDK (compat version - required for firebase_messaging_web) -->
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-messaging-compat.js"></script>

  <!--
    FIX: ERR_CACHE_OPERATION_NOT_SUPPORTED
    Flutter Web service worker intercepts ALL fetch requests and tries to cache
    responses. HTTP Range requests (used by <video> for byte-range streaming) return
    HTTP 206 Partial Content, which the Cache API cannot store.
    media_sw.js intercepts Firebase Storage + Range requests FIRST,
    passing them straight to the network without touching the Cache API.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('media_sw.js?v=2', { scope: '/' })
        .then(function(reg) {
          reg.update();
          console.log('[MediaSW] Registered & updated, scope:', reg.scope);
        })
        .catch(function(err) {
          console.warn('[MediaSW] Registration failed:', err);
        });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
